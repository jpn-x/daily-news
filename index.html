<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>今日のニュース</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="今日のニュース">
  <meta name="theme-color" content="#f18d00">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange:    #f18d00;
      --orange-dk: #d47d00;
      --orange-lt: #fff4e0;
      --red:       #d32f2f;
      --bg:        #fdf6ee;
      --card:      #ffffff;
      --text:      #333;
      --sub:       #888;
      --brown:     #5D4037;
      --radius:    18px;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
      color: var(--text);
    }

    /* ========== ヘッダー ========== */
    .header {
      background: var(--orange);
      padding: 16px 18px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .header-title {
      font-size: 1.75rem;
      font-weight: bold;
      color: white;
      letter-spacing: 0.04em;
    }

    .btn-next {
      background: white;
      color: var(--orange-dk);
      border: none;
      border-radius: 14px;
      padding: 13px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-next:active { opacity: 0.65; }

    /* ========== メインカード ========== */
    .main-card {
      margin: 20px 16px 0;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    /* チャンネルカラーバー */
    .card-color-bar {
      height: 10px;
    }

    .card-body {
      padding: 24px 22px 20px;
    }

    .card-label {
      font-size: 0.95rem;
      color: var(--sub);
      margin-bottom: 6px;
    }

    .card-channel {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .card-emoji {
      font-size: 3rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .card-name {
      font-size: 2rem;
      font-weight: bold;
      color: var(--brown);
      line-height: 1.2;
    }

    .card-desc {
      font-size: 1.05rem;
      color: var(--sub);
      margin-top: 4px;
    }

    /* 大きい再生ボタン */
    .btn-play {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      padding: 26px 20px;
      background: var(--red);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1.7rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.12s;
      margin-bottom: 0;
    }
    .btn-play:active { opacity: 0.72; }

    .play-icon {
      font-size: 2.2rem;
      line-height: 1;
    }

    /* ヒント */
    .card-hint {
      text-align: center;
      font-size: 0.95rem;
      color: var(--sub);
      padding: 12px 0 4px;
    }

    /* ========== シャッフルボタン ========== */
    .btn-shuffle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: calc(100% - 32px);
      margin: 18px 16px 0;
      padding: 24px 20px;
      background: var(--orange);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1.55rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.12s;
    }
    .btn-shuffle:active { opacity: 0.72; }

    /* ========== チャンネル選択 ========== */
    .section-title {
      padding: 26px 18px 12px;
      font-size: 1.05rem;
      color: var(--sub);
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .ch-grid {
      padding: 0 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .ch-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 3px solid #FFCC80;
      border-radius: 14px;
      padding: 17px 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--brown);
      cursor: pointer;
      text-align: left;
      transition: background 0.1s, border-color 0.1s;
    }

    .ch-btn .emoji { font-size: 1.7rem; flex-shrink: 0; }
    .ch-btn .name  { flex: 1; }
    .ch-btn .arrow { font-size: 1.2rem; color: #ccc; flex-shrink: 0; }

    .ch-btn.active {
      background: var(--orange-lt);
      border-color: var(--orange);
      color: var(--orange-dk);
    }
    .ch-btn.active .arrow { color: var(--orange); }
    .ch-btn:active { opacity: 0.72; }

    /* ========== フッター ========== */
    .footer {
      text-align: center;
      padding: 14px 16px 28px;
      color: #BCAAA4;
      font-size: 0.9rem;
      border-top: 1px solid #FFE0B2;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-title">📺 今日のニュース</div>
    <button class="btn-next" onclick="shuffleChannel()">🎲 次へ</button>
  </div>

  <!-- メインカード -->
  <div class="main-card">
    <div class="card-color-bar" id="colorBar"></div>
    <div class="card-body">
      <div class="card-label">今日のおすすめチャンネル</div>
      <div class="card-channel">
        <div class="card-emoji" id="chEmoji">⏳</div>
        <div>
          <div class="card-name" id="chName">読み込み中…</div>
          <div class="card-desc" id="chDesc"></div>
        </div>
      </div>

      <!-- 大きい再生ボタン -->
      <a class="btn-play" id="playBtn" href="#" target="_blank" rel="noopener noreferrer"
         onclick="onPlayClick(event)">
        <span class="play-icon">▶</span>
        <span>YouTubeで見る</span>
      </a>

      <div class="card-hint" id="cardHint">
        ↑ タップするとYouTubeが開くよ！
      </div>
    </div>
  </div>

  <!-- シャッフルボタン -->
  <button class="btn-shuffle" onclick="shuffleChannel()">
    🎲 別のニュースを見る
  </button>

  <!-- チャンネル一覧 -->
  <div class="section-title">▼ チャンネルを選んで見る</div>
  <div class="ch-grid" id="chGrid"></div>

  <div class="footer">ページを開くたびにランダムで始まるよ 🎉</div>

  <script>
    // ===== チャンネル定義 =====
    const channels = [
      {
        name: 'NHK ニュース',
        emoji: '🔵',
        color: '#1565C0',
        desc: 'NHK 公式 — 国内・国際ニュース',
        url: 'https://www.youtube.com/@nhknewsweb/videos'
      },
      {
        name: 'TBS NEWS DIG',
        emoji: '🔴',
        color: '#B71C1C',
        desc: 'TBSテレビ — 速報・解説',
        url: 'https://www.youtube.com/@tbsnewsdig/videos'
      },
      {
        name: 'テレ朝 ANNニュース',
        emoji: '🟡',
        color: '#F57F17',
        desc: 'テレビ朝日 — 最新ニュース',
        url: 'https://www.youtube.com/@ANNnewsCH/videos'
      },
      {
        name: 'FNN プライムオンライン',
        emoji: '🟠',
        color: '#E65100',
        desc: 'フジテレビ系 — ニュース動画',
        url: 'https://www.youtube.com/@FNNnewsCH/videos'
      },
      {
        name: '日テレ NEWS',
        emoji: '🟢',
        color: '#2E7D32',
        desc: '日本テレビ — 国内外のニュース',
        url: 'https://www.youtube.com/@ntv_news/videos'
      },
      {
        name: 'テレ東 BIZ',
        emoji: '🟣',
        color: '#6A1B9A',
        desc: 'テレビ東京 — 経済・社会ニュース',
        url: 'https://www.youtube.com/@tvtokyobiz/videos'
      }
    ];

    let currentIndex = -1;

    function buildGrid() {
      const grid = document.getElementById('chGrid');
      channels.forEach((ch, i) => {
        const btn = document.createElement('button');
        btn.className = 'ch-btn';
        btn.id = 'ch-' + i;
        btn.innerHTML =
          `<span class="emoji">${ch.emoji}</span>` +
          `<span class="name">${ch.name}</span>` +
          `<span class="arrow">▶</span>`;
        btn.addEventListener('click', () => {
          loadChannel(i);
          openChannel(channels[i]);
        });
        grid.appendChild(btn);
      });
    }

    function loadChannel(index) {
      document.querySelectorAll('.ch-btn').forEach((b, i) => {
        b.classList.toggle('active', i === index);
      });

      currentIndex = index;
      const ch = channels[index];

      document.getElementById('chEmoji').textContent = ch.emoji;
      document.getElementById('chName').textContent  = ch.name;
      document.getElementById('chDesc').textContent  = ch.desc;
      document.getElementById('colorBar').style.background = ch.color;
      document.getElementById('playBtn').href = ch.url;
    }

    function openChannel(ch) {
      window.open(ch.url, '_blank', 'noopener,noreferrer');
    }

    function onPlayClick(e) {
      // リンクはそのまま href で開く（preventDefault しない）
    }

    function shuffleChannel() {
      let next;
      if (channels.length === 1) { next = 0; }
      else {
        do { next = Math.floor(Math.random() * channels.length); }
        while (next === currentIndex);
      }
      loadChannel(next);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    buildGrid();
    shuffleChannel();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>今日のニュース</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="今日のニュース">
  <meta name="theme-color" content="#f18d00">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange:    #f18d00;
      --orange-dk: #d47d00;
      --orange-lt: #fff4e0;
      --bg:        #fdf6ee;
      --card:      #ffffff;
      --text:      #333;
      --sub:       #888;
      --brown:     #5D4037;
      --radius:    16px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ========== ヘッダー ========== */
    .header {
      flex-shrink: 0;
      background: var(--orange);
      padding: 10px 14px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title {
      font-size: 1.45rem;
      font-weight: bold;
      color: white;
      letter-spacing: 0.04em;
      flex: 1;
    }

    /* ヘッダーのボタン（閉じる・次のチャンネル 共通） */
    .btn-header {
      background: white;
      color: var(--orange-dk);
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-header:active { opacity: 0.65; }

    /* ========== チャンネル名バー ========== */
    .channel-bar {
      flex-shrink: 0;
      background: var(--orange-lt);
      border-bottom: 4px solid var(--orange);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ch-emoji { font-size: 1.8rem; flex-shrink: 0; }
    .ch-texts { flex: 1; }
    .ch-label { font-size: 0.85rem; color: var(--sub); margin-bottom: 2px; }
    .ch-name  { font-size: 1.4rem; font-weight: bold; color: var(--brown); line-height: 1.2; }

    /* ========== 動画エリア ========== */
    .video-area {
      flex: 1;
      position: relative;
      background: #111;
      overflow: hidden;
    }

    .video-area iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      transition: opacity 0.3s;
    }

    /* ローディング */
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      gap: 16px;
      font-size: 1.1rem;
      z-index: 10;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== チャンネルタブ（横スクロール） ========== */
    .ch-tabs {
      flex-shrink: 0;
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 10px 14px 8px;
      background: var(--bg);
      scrollbar-width: none;
    }
    .ch-tabs::-webkit-scrollbar { display: none; }

    .ch-tab {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: var(--card);
      border: 2px solid #FFCC80;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--brown);
      cursor: pointer;
      white-space: nowrap;
    }

    .ch-tab.active {
      background: var(--orange-lt);
      border-color: var(--orange);
      color: var(--orange-dk);
    }
    .ch-tab:active { opacity: 0.72; }

    /* ========== ランダム動画ボタン ========== */
    .random-bar {
      flex-shrink: 0;
      padding: 0 14px 10px;
      background: var(--bg);
    }

    .btn-random {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 12px;
      background: #5c6bc0;   /* 区別しやすい青紫 */
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.12s;
    }
    .btn-random:active { opacity: 0.72; }
    .btn-random:disabled { opacity: 0.55; cursor: default; }

    /* ========== 下部ボタン ========== */
    .bottom-bar {
      flex-shrink: 0;
      padding: 0 14px 12px;
      display: flex;
      gap: 10px;
      background: var(--bg);
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 12px;
      border: none;
      border-radius: var(--radius);
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.12s;
    }
    .btn:active { opacity: 0.72; }

    .btn-shuffle { background: var(--orange); color: white; }

    .btn-ehime {
      background: #2e7d32;
      color: white;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-title">📺 今日のニュース</div>
    <button class="btn-header" onclick="closeApp()">✕ 閉じる</button>
    <button class="btn-header" onclick="shuffleChannel()">🎲 次のチャンネル</button>
  </div>

  <!-- いま見ているチャンネル -->
  <div class="channel-bar">
    <div class="ch-emoji" id="chEmoji">⏳</div>
    <div class="ch-texts">
      <div class="ch-label" id="chLabel">いま見ているチャンネル</div>
      <div class="ch-name" id="chName">読み込み中…</div>
    </div>
  </div>

  <!-- 動画 -->
  <div class="video-area">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div id="loadingMsg">動画を読み込んでいます…</div>
    </div>
    <iframe id="ytFrame"
      src="about:blank"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <!-- チャンネルタブ -->
  <div class="ch-tabs" id="chTabs"></div>

  <!-- ランダム動画ボタン -->
  <div class="random-bar">
    <button class="btn-random" id="btnRandom" onclick="randomVideo()">
      🎰 ランダムでニュースを見る
    </button>
  </div>

  <!-- 下部ボタン -->
  <div class="bottom-bar">
    <button class="btn btn-shuffle" onclick="shuffleChannel()">
      🎲 別のニュースを見る
    </button>
    <button class="btn btn-ehime" onclick="ehimeNews()">
      🍊 愛媛のニュース
    </button>
  </div>

</div>
<script>
  // ===== チャンネル定義（oEmbed で埋め込み確認済み）=====
  const channels = [
    {
      name: 'TBS NEWS DIG',
      emoji: '🔴',
      channelId: 'UCeCmAYh1ylwIsgGrmqaklzg',
      playlistId: 'UUeCmAYh1ylwIsgGrmqaklzg',
      url: 'https://www.youtube.com/@tbsnewsdig/videos'
    },
    {
      name: 'FNN プライムオンライン',
      emoji: '🟠',
      channelId: 'UC1ipzc08F-FjrZ5jIaZVPIw',
      playlistId: 'UU1ipzc08F-FjrZ5jIaZVPIw',
      url: 'https://www.youtube.com/@FNNnewsCH/videos'
    },
    {
      name: '日テレ NEWS',
      emoji: '🟢',
      channelId: 'UCWt0yfrBaUk148rxaOp4b4w',
      playlistId: 'UUWt0yfrBaUk148rxaOp4b4w',
      url: 'https://www.youtube.com/@ntv_news/videos'
    }
  ];

  let currentIndex = -1;

  // ===== タブ生成 =====
  function buildTabs() {
    const tabs = document.getElementById('chTabs');
    channels.forEach((ch, i) => {
      const btn = document.createElement('button');
      btn.className = 'ch-tab';
      btn.id = 'tab-' + i;
      btn.innerHTML = `<span>${ch.emoji}</span><span>${ch.name}</span>`;
      btn.addEventListener('click', () => loadChannel(i));
      tabs.appendChild(btn);
    });
  }

  // ===== iframe セット共通 =====
  function setIframe(src, label) {
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('loadingMsg').textContent = label || '動画を読み込んでいます…';
    const frame = document.getElementById('ytFrame');
    frame.style.opacity = '0';
    frame.src = 'about:blank';
    setTimeout(() => {
      frame.src = src;
      frame.onload = () => {
        document.getElementById('loading').style.display = 'none';
        frame.style.opacity = '1';
      };
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        frame.style.opacity = '1';
      }, 8000);
    }, 100);
  }

  // ===== チャンネルプレイリストを読み込む =====
  function loadChannel(index) {
    document.querySelectorAll('.ch-tab').forEach((b, i) => b.classList.toggle('active', i === index));
    currentIndex = index;
    const ch = channels[index];

    document.getElementById('chEmoji').textContent = ch.emoji;
    document.getElementById('chLabel').textContent = 'いま見ているチャンネル';
    document.getElementById('chName').textContent  = ch.name;

    const src = 'https://www.youtube.com/embed/videoseries'
      + '?list=' + ch.playlistId
      + '&autoplay=1&rel=0&hl=ja&modestbranding=1';
    setIframe(src, 'チャンネルを読み込んでいます…');
  }

  // ===== 次のチャンネル（プレイリスト切り替え）=====
  function shuffleChannel() {
    let next;
    if (channels.length === 1) { next = 0; }
    else { do { next = Math.floor(Math.random() * channels.length); } while (next === currentIndex); }
    loadChannel(next);
  }

  // ===== 🎰 ランダム動画（RSSから個別ビデオIDを取得）=====
  async function randomVideo() {
    const btn = document.getElementById('btnRandom');
    btn.disabled = true;
    btn.textContent = '⏳ 探しています…';

    // タブのアクティブを外す（ランダム選択中なので）
    document.querySelectorAll('.ch-tab').forEach(b => b.classList.remove('active'));

    try {
      // ランダムにチャンネルを選ぶ（前回と別チャンネルでなくてOK）
      const ch = channels[Math.floor(Math.random() * channels.length)];

      // YouTube RSS → CORS プロキシ経由で取得
      const rssUrl = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + ch.channelId;
      const proxy  = 'https://api.allorigins.win/get?url=' + encodeURIComponent(rssUrl);

      const resp = await fetch(proxy, { signal: AbortSignal.timeout(10000) });
      const data = await resp.json();

      const parser  = new DOMParser();
      const xml     = parser.parseFromString(data.contents, 'text/xml');
      const entries = [...xml.querySelectorAll('entry')];

      if (!entries.length) throw new Error('no entries');

      // 最新15本の中からランダムに1本選ぶ
      const pool  = entries.slice(0, 15);
      const entry = pool[Math.floor(Math.random() * pool.length)];
      const link  = entry.querySelector('link[rel="alternate"]');
      const href  = link?.getAttribute('href') || '';
      const match = href.match(/[?&]v=([^&]+)/);
      if (!match) throw new Error('no videoId');

      const videoId = match[1];
      const title   = entry.querySelector('title')?.textContent || ch.name;

      // UI更新
      document.getElementById('chEmoji').textContent = ch.emoji;
      document.getElementById('chLabel').textContent = '🎰 ランダム選択 — ' + ch.name;
      document.getElementById('chName').textContent  = title;
      document.getElementById('ytOpenBtn').href = 'https://www.youtube.com/watch?v=' + videoId;

      const src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0&hl=ja';
      setIframe(src, '動画を読み込んでいます…');

    } catch (e) {
      // 取得失敗時はプレイリストにフォールバック
      shuffleChannel();
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🎰 ランダムでニュースを見る';
    }
  }

  // ===== 🍊 愛媛のニュース =====
  const EHIME_CH = {
    name: 'テレビ愛媛',
    emoji: '🍊',
    channelId: 'UCISf7aH1HqBtTD9jPgzIfVA',
    playlistId: 'UUISf7aH1HqBtTD9jPgzIfVA'
  };

  async function ehimeNews() {
    document.querySelectorAll('.ch-tab').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector('.btn-ehime');
    btn.disabled = true;
    btn.textContent = '⏳ 探しています…';

    try {
      const rssUrl = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + EHIME_CH.channelId;
      const proxy  = 'https://api.allorigins.win/get?url=' + encodeURIComponent(rssUrl);
      const resp   = await fetch(proxy, { signal: AbortSignal.timeout(10000) });
      const data   = await resp.json();

      const xml     = new DOMParser().parseFromString(data.contents, 'text/xml');
      const entries = [...xml.querySelectorAll('entry')];
      if (!entries.length) throw new Error('no entries');

      const entry = entries.slice(0, 15)[Math.floor(Math.random() * Math.min(15, entries.length))];
      const href  = entry.querySelector('link[rel="alternate"]')?.getAttribute('href') || '';
      const match = href.match(/[?&]v=([^&]+)/);
      if (!match) throw new Error('no videoId');

      const videoId = match[1];
      const title   = entry.querySelector('title')?.textContent || EHIME_CH.name;

      document.getElementById('chEmoji').textContent = EHIME_CH.emoji;
      document.getElementById('chLabel').textContent = '🍊 愛媛のニュース — ' + EHIME_CH.name;
      document.getElementById('chName').textContent  = title;

      setIframe('https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0&hl=ja', '愛媛のニュースを読み込んでいます…');

    } catch {
      // フォールバック：プレイリスト全体
      document.getElementById('chEmoji').textContent = EHIME_CH.emoji;
      document.getElementById('chLabel').textContent = '🍊 愛媛のニュース — ' + EHIME_CH.name;
      document.getElementById('chName').textContent  = EHIME_CH.name;
      setIframe('https://www.youtube.com/embed/videoseries?list=' + EHIME_CH.playlistId + '&autoplay=1&rel=0&hl=ja', '愛媛のニュースを読み込んでいます…');
    } finally {
      btn.disabled = false;
      btn.textContent = '🍊 愛媛のニュース';
    }
  }

  // ===== 閉じる =====
  function closeApp() {
    // PWA standalone / ブラウザ両対応
    if (window.history.length > 1) { window.history.back(); }
    window.close();
  }

  buildTabs();
  shuffleChannel();
</script>
</body>
</html>

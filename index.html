<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>今日のニュース</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="今日のニュース">
  <meta name="theme-color" content="#f18d00">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange:    #f18d00;
      --orange-dk: #d47d00;
      --orange-lt: #fff4e0;
      --bg:        #fdf6ee;
      --card:      #ffffff;
      --text:      #333;
      --sub:       #888;
      --brown:     #5D4037;
      --radius:    16px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ========== ヘッダー ========== */
    .header {
      flex-shrink: 0;
      background: var(--orange);
      padding: 10px 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      letter-spacing: 0.04em;
    }

    .btn-next {
      background: white;
      color: var(--orange-dk);
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-next:active { opacity: 0.65; }

    /* ========== チャンネル名バー ========== */
    .channel-bar {
      flex-shrink: 0;
      background: var(--orange-lt);
      border-bottom: 4px solid var(--orange);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ch-emoji { font-size: 1.8rem; flex-shrink: 0; }

    .ch-texts { flex: 1; }
    .ch-label { font-size: 0.85rem; color: var(--sub); margin-bottom: 2px; }
    .ch-name  { font-size: 1.4rem; font-weight: bold; color: var(--brown); }

    /* ========== 動画エリア ========== */
    .video-area {
      flex: 1;
      position: relative;
      background: #111;
      overflow: hidden;
    }

    .video-area iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ローディング表示 */
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      gap: 16px;
      font-size: 1.1rem;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== 下部ボタン ========== */
    .bottom-bar {
      flex-shrink: 0;
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      background: var(--bg);
      border-top: 2px solid var(--orange-lt);
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 18px 12px;
      border: none;
      border-radius: var(--radius);
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.12s;
    }
    .btn:active { opacity: 0.72; }

    .btn-shuffle {
      background: var(--orange);
      color: white;
    }

    .btn-open {
      background: #c62828;
      color: white;
      flex: 0 0 auto;
      padding: 18px 16px;
      font-size: 1rem;
    }

    /* ========== チャンネルタブ（横スクロール） ========== */
    .ch-tabs {
      flex-shrink: 0;
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 0 14px 10px;
      background: var(--bg);
      scrollbar-width: none;
    }
    .ch-tabs::-webkit-scrollbar { display: none; }

    .ch-tab {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: var(--card);
      border: 2px solid #FFCC80;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--brown);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s, border-color 0.1s;
    }

    .ch-tab.active {
      background: var(--orange-lt);
      border-color: var(--orange);
      color: var(--orange-dk);
    }
    .ch-tab:active { opacity: 0.72; }
  </style>
</head>
<body>
<div id="app">

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-title">📺 今日のニュース</div>
    <button class="btn-next" onclick="shuffleChannel()">🎲 次のチャンネル</button>
  </div>

  <!-- いま見ているチャンネル -->
  <div class="channel-bar">
    <div class="ch-emoji" id="chEmoji">⏳</div>
    <div class="ch-texts">
      <div class="ch-label">いま見ているチャンネル</div>
      <div class="ch-name" id="chName">読み込み中…</div>
    </div>
  </div>

  <!-- 動画 -->
  <div class="video-area">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>動画を読み込んでいます…</div>
    </div>
    <iframe id="ytFrame"
      src="about:blank"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <!-- チャンネルタブ -->
  <div class="ch-tabs" id="chTabs"></div>

  <!-- 下部ボタン -->
  <div class="bottom-bar">
    <button class="btn btn-shuffle" onclick="shuffleChannel()">
      🎲 別のニュースを見る
    </button>
    <a class="btn btn-open" id="ytOpenBtn" href="#" target="_blank" rel="noopener noreferrer">
      ▶ YT
    </a>
  </div>

</div>
<script>
  // ===== チャンネル定義（oEmbed で埋め込み確認済み）=====
  const channels = [
    {
      name: 'TBS NEWS DIG',
      emoji: '🔴',
      // channel: UCeCmAYh1ylwIsgGrmqaklzg → uploads playlist UU...
      playlistId: 'UUeCmAYh1ylwIsgGrmqaklzg',
      url: 'https://www.youtube.com/@tbsnewsdig/videos'
    },
    {
      name: 'FNN プライムオンライン',
      emoji: '🟠',
      // channel: UC1ipzc08F-FjrZ5jIaZVPIw
      playlistId: 'UU1ipzc08F-FjrZ5jIaZVPIw',
      url: 'https://www.youtube.com/@FNNnewsCH/videos'
    },
    {
      name: '日テレ NEWS',
      emoji: '🟢',
      // channel: UCWt0yfrBaUk148rxaOp4b4w
      playlistId: 'UUWt0yfrBaUk148rxaOp4b4w',
      url: 'https://www.youtube.com/@ntv_news/videos'
    }
  ];

  let currentIndex = -1;

  function buildTabs() {
    const tabs = document.getElementById('chTabs');
    channels.forEach((ch, i) => {
      const btn = document.createElement('button');
      btn.className = 'ch-tab';
      btn.id = 'tab-' + i;
      btn.innerHTML = `<span>${ch.emoji}</span><span>${ch.name}</span>`;
      btn.addEventListener('click', () => loadChannel(i));
      tabs.appendChild(btn);
    });
  }

  function loadChannel(index) {
    document.querySelectorAll('.ch-tab').forEach((b, i) => {
      b.classList.toggle('active', i === index);
    });

    currentIndex = index;
    const ch = channels[index];

    document.getElementById('chEmoji').textContent = ch.emoji;
    document.getElementById('chName').textContent  = ch.name;
    document.getElementById('ytOpenBtn').href = ch.url;

    // ローディング表示
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('ytFrame').style.opacity = '0';

    const src = 'https://www.youtube.com/embed/videoseries' +
      '?list=' + ch.playlistId +
      '&autoplay=1&rel=0&hl=ja&modestbranding=1';

    const frame = document.getElementById('ytFrame');
    frame.src = 'about:blank';
    // 少し待ってからセット（リセット確実に）
    setTimeout(() => {
      frame.src = src;
      // ロード完了後にフェードイン
      frame.onload = () => {
        document.getElementById('loading').style.display = 'none';
        frame.style.opacity = '1';
      };
      // 8秒でタイムアウト（onloadが来ない場合）
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        frame.style.opacity = '1';
      }, 8000);
    }, 100);
  }

  function shuffleChannel() {
    let next;
    if (channels.length === 1) { next = 0; }
    else {
      do { next = Math.floor(Math.random() * channels.length); }
      while (next === currentIndex);
    }
    loadChannel(next);
  }

  buildTabs();
  shuffleChannel();
</script>
</body>
</html>
